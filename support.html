<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Support SubtitleMate</title>
  <style>
    :root {
      --primary: #E53935;
      --bg: #FAFAFA;
      --text: #1F1F1F;
      --secondary: #757575;
      --surface: #FFFFFF;
      --border: #FFE0E0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .card {
      width: 320px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px 22px;
      text-align: center;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .qr {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto;
      display: block;
    }
    .qr-note {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 12px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .paypal-btn {
      display: inline-block;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #003087;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .paypal-btn:hover { background: #001f5c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Support SubtitleMate</h1>

    <img class="qr" src="icons/wechat-reward.png" alt="WeChat reward QR code" />
    <div class="qr-note" id="wechatNote">Scan with WeChat to send a reward.</div>

    <a id="paypalBtn" class="paypal-btn" href="https://www.paypal.com/ncp/payment/6EPWW7KXXXA56" target="_blank" rel="noopener">Pay with PayPal</a>
  </div>

  <script>
    (function () {
      const I18N = {
        en: {
          title: 'Support SubtitleMate',
          wechatNote: 'Scan with WeChat to send a reward.',
          paypalBtn: 'Pay with PayPal',
        },
        zh: {
          title: '支持 SubtitleMate',
          wechatNote: '用微信扫一扫，赞赏开发者。',
          paypalBtn: '用 PayPal 付款',
        },
      };
      const lang = (function () {
        try {
          const params = new URL(window.location.href).searchParams;
          const fromUrl = params.get('lang');
          if (fromUrl === 'en' || fromUrl === 'zh') return fromUrl;
        } catch (e) {}
        const stored = localStorage.getItem('sm_uiLang');
        if (stored === 'en' || stored === 'zh') return stored;
        const nav = (navigator.language || 'en').toLowerCase();
        return nav.startsWith('zh') ? 'zh' : 'en';
      })();
      const t = I18N[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('title').textContent = t.title;
      document.getElementById('wechatNote').textContent = t.wechatNote;
      document.getElementById('paypalBtn').textContent = t.paypalBtn;
    })();
  </script>
</body>
</html>
