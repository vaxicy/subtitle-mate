<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Support SubtitleMate</title>
  <style>
    :root {
      --primary: #E53935;
      --bg: #FAFAFA;
      --text: #1F1F1F;
      --secondary: #757575;
      --surface: #FFFFFF;
      --border: #FFE0E0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .card {
      width: 320px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px 22px;
      text-align: center;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .qr {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto;
      display: block;
    }
    .qr-note {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 12px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .paypal-btn {
      display: inline-block;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #003087;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .paypal-btn:hover { background: #001f5c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Support SubtitleMate</h1>

    <img class="qr" src="icons/wechat-reward.png" alt="WeChat reward QR code" />
    <div class="qr-note" id="wechatNote">Scan with WeChat to send a reward.</div>

    <a id="paypalBtn" class="paypal-btn" href="https://www.paypal.com/ncp/payment/6EPWW7KXXXA56" target="_blank" rel="noopener">Pay with PayPal</a>
  </div>

  <script src="support.js"></script>
</body>
</html>
