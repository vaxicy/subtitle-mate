<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Support SubtitleMate</title>
  <style>
    :root {
      --primary: #E53935;
      --bg: #FAFAFA;
      --text: #1F1F1F;
      --secondary: #757575;
      --surface: #FFFFFF;
      --border: #FFE0E0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    .card {
      width: 320px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 24px 22px;
      text-align: center;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--secondary);
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab.active {
      color: var(--primary);
      background: var(--surface);
      border-color: var(--border);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .qr {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto;
      display: block;
    }
    .qr-note {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 10px;
      line-height: 1.5;
    }
    .paypal-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #003087;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .paypal-btn:hover { background: #001f5c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Support SubtitleMate</h1>
    <div class="sub" id="subtitle">Your support keeps this extension free and ad-free.</div>

    <div class="tabs">
      <div class="tab active" id="tabWechat" data-tab="wechat">WeChat</div>
      <div class="tab" id="tabPaypal" data-tab="paypal">PayPal</div>
    </div>

    <div class="panel active" id="panelWechat">
      <img class="qr" src="icons/wechat-reward.png" alt="WeChat reward QR code" />
      <div class="qr-note" id="wechatNote">Scan with WeChat to send a reward.</div>
    </div>

    <div class="panel" id="panelPaypal">
      <a id="paypalBtn" class="paypal-btn" href="https://www.paypal.com/ncp/payment/6EPWW7KXXXA56" target="_blank" rel="noopener">Pay with PayPal</a>
    </div>
  </div>

  <script>
    (function () {
      const I18N = {
        en: {
          title: 'Support SubtitleMate',
          subtitle: 'Your support keeps this extension free and ad-free.',
          wechat: 'WeChat',
          wechatNote: 'Scan with WeChat to send a reward.',
          paypal: 'PayPal',
          paypalBtn: 'Pay with PayPal',
        },
        zh: {
          title: '支持 SubtitleMate',
          subtitle: '你的支持让这个扩展保持免费、无广告。',
          wechat: '微信',
          wechatNote: '用微信扫一扫，赞赏开发者。',
          paypal: 'PayPal',
          paypalBtn: '用 PayPal 付款',
        },
      };
      const lang = (function () {
        try {
          const params = new URL(window.location.href).searchParams;
          const fromUrl = params.get('lang');
          if (fromUrl === 'en' || fromUrl === 'zh') return fromUrl;
        } catch (e) {}
        const stored = localStorage.getItem('sm_uiLang');
        if (stored === 'en' || stored === 'zh') return stored;
        const nav = (navigator.language || 'en').toLowerCase();
        return nav.startsWith('zh') ? 'zh' : 'en';
      })();
      const t = I18N[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('tabWechat').textContent = t.wechat;
      document.getElementById('tabPaypal').textContent = t.paypal;
      document.getElementById('wechatNote').textContent = t.wechatNote;
      document.getElementById('paypalBtn').textContent = t.paypalBtn;

      const tabWechat = document.getElementById('tabWechat');
      const tabPaypal = document.getElementById('tabPaypal');
      const panelWechat = document.getElementById('panelWechat');
      const panelPaypal = document.getElementById('panelPaypal');
      function switchTab(which) {
        const isWechat = which === 'wechat';
        tabWechat.classList.toggle('active', isWechat);
        tabPaypal.classList.toggle('active', !isWechat);
        panelWechat.classList.toggle('active', isWechat);
        panelPaypal.classList.toggle('active', !isWechat);
      }
      tabWechat.addEventListener('click', () => switchTab('wechat'));
      tabPaypal.addEventListener('click', () => switchTab('paypal'));
    })();
  </script>
</body>
</html>
