<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <header class="header">
      <img id="logo" class="logo" alt="SubtitleMate" width="28" height="28" />
      <span class="title" id="extName">SubtitleMate</span>
    </header>

    <section class="row">
      <div class="row-text">
        <div class="row-title" id="lblAutoCaptions">Auto-enable captions</div>
      </div>
      <button id="toggleAuto" class="toggle" role="switch" aria-checked="true">
        <span class="knob"></span>
      </button>
    </section>

    <section class="block">
      <label class="block-label" id="lblCaptionMode">Caption mode</label>
      <select id="captionMode" class="select"></select>
    </section>

    <section class="block">
      <label class="block-label" id="lblTargetLang">Translate to</label>
      <span class="block-hint" id="lblTargetLangHint"></span>
      <select id="targetLang" class="select"></select>
    </section>

    <section class="checks">
      <label class="check">
        <input type="checkbox" id="chkRemember" />
        <span id="lblRemember">Remember language preference</span>
      </label>
      <label class="check">
        <input type="checkbox" id="chkAutoYt" />
        <span id="lblAutoYt">Enable automatically on YouTube</span>
      </label>
    </section>

    <footer class="footer">
      <button id="btnApply" class="apply-link" title="Apply to current video">
        <svg class="apply-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M8 3V1M8 3C6.3 3 5 4.3 5 6c0 1.4.8 2.6 2 3.2V13h2V9.2C10.2 8.6 11 7.4 11 6c0-1.7-1.3-3-3-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="btnApplyText"></span>
      </button>
      <span class="saved" id="savedHint"></span>
      <button id="langSwitch" class="lang-switch" title="Switch UI language">EN / 中文</button>
    </footer>
  </div>

  <script src="../shared/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
