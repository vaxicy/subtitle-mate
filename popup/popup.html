<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <header class="header">
      <img id="logo" class="logo" alt="SubtitleMate" width="22" height="22" />
      <span class="title" id="extName">SubtitleMate</span>
      <button id="langSwitch" class="lang-switch" title="Switch UI language">EN / 中文</button>
    </header>

    <section class="row">
      <div class="row-text">
        <div class="row-title" id="lblAutoCaptions">Auto-enable captions</div>
      </div>
      <button id="toggleAuto" class="toggle" role="switch" aria-checked="true">
        <span class="knob"></span>
      </button>
    </section>

    <section class="block">
      <label class="block-label" id="lblCaptionMode">Caption mode</label>
      <select id="captionMode" class="select"></select>
    </section>

    <section class="block">
      <label class="block-label" id="lblTargetLang">Translate to</label>
      <span class="block-hint" id="lblTargetLangHint"></span>
      <select id="targetLang" class="select"></select>
    </section>

    <section class="checks">
      <label class="check">
        <input type="checkbox" id="chkAutoYt" />
        <span id="lblAutoYt">Enable automatically on YouTube</span>
      </label>
      <label class="check">
        <input type="checkbox" id="chkAutoReload" />
        <span id="lblAutoReload">Auto-reload page if it fails</span>
      </label>
    </section>

    <section class="support">
      <div class="support-title" id="lblSupportTitle">Support the developer</div>
      <div class="support-desc" id="lblSupportDesc">If SubtitleMate helps you, consider buying me a coffee.</div>
      <div class="support-actions">
        <button id="btnPaypal" class="support-btn paypal" type="button">PayPal</button>
        <div class="wechat">
          <button id="btnWechat" class="support-btn wechat-toggle" type="button">WeChat</button>
          <img id="wechatQr" class="wechat-qr" src="../icons/wechat-reward.png" alt="WeChat reward QR code" />
        </div>
      </div>
    </section>

    <span class="saved" id="savedHint"></span>
  </div>

  <script src="../shared/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
